name: Verify Gemini Access

on:
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Test Gemini API Connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import random
          import time
          from google import genai
          from google.genai import errors

          PRIMARY_MODEL = "gemini-3.8-flash"
          FALLBACK_MODEL = "gemini-3.5-flash-lite"
          RETRYABLE_CODES = {429, 503}
          BACKOFF_DELAYS = [5, 10, 20]  # seconds between rounds, plus jitter

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          def call(model):
              return client.models.generate_content(
                  model=model,
                  contents="Respond with the exact words: Gemini connection verified successfully."
              )

          # Each round tries the primary model, then the fallback if the primary is
          # overloaded or rate-limited. Any other error fails immediately.
          response = None
          for round_num in range(len(BACKOFF_DELAYS) + 1):
              for model in (PRIMARY_MODEL, FALLBACK_MODEL):
                  try:
                      response = call(model)
                      used_model = model
                      break
                  except errors.APIError as e:
                      if e.code not in RETRYABLE_CODES:
                          raise
                      last_error = e
                      print(f"Round {round_num + 1}: {model} returned {e.code}")
              if response is not None:
                  break
              if round_num < len(BACKOFF_DELAYS):
                  delay = BACKOFF_DELAYS[round_num] + random.uniform(0, 2)
                  print(f"Both models busy; retrying in {delay:.1f}s...")
                  time.sleep(delay)

          if response is None:
              raise last_error

          print(f"\nModel used: {used_model}")
          print("--- GEMINI RESPONSE ---")
          print(response.text.strip())
          print("-----------------------\n")
          EOF

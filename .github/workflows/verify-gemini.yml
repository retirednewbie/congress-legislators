name: Verify Gemini Access

on:
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Test Gemini API Connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import time
          from google import genai
          from google.genai import errors

          MAX_ATTEMPTS = 5

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          for attempt in range(1, MAX_ATTEMPTS + 1):
              try:
                  response = client.models.generate_content(
                      model="gemini-2.0-flash",
                      contents="Respond with the exact words: Gemini connection verified successfully."
                  )
                  break
              except errors.APIError as e:
                  # Retry only on overload/rate-limit errors; fail fast on anything else
                  retryable = e.code == 429 or e.code >= 500
                  if not retryable or attempt == MAX_ATTEMPTS:
                      raise
                  delay = min(2 ** attempt, 5)  # 2s, 4s, 5s, 5s
                  print(f"Attempt {attempt} failed with {e.code}; retrying in {delay}s...")
                  time.sleep(delay)

          print("\n--- GEMINI RESPONSE ---")
          print(response.text.strip())
          print("-----------------------\n")
          EOF
